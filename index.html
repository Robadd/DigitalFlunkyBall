<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Teamspiel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍻 Teamspiel</h1>
    <span id="net" class="net"></span>
  </header>

  <button id="soundHint" class="sound-hint hidden" type="button">🔈 Tippen, um Ton zu aktivieren</button>

  <main id="view" class="view v-plain">
    <div class="sub">Lade …</div>
  </main>

  <section id="teams" class="teams hidden"></section>
  <footer id="foot"></footer>
  <div id="toast" class="toast hidden"></div>

  <audio id="countdownMusic" preload="auto" loop>
    <source src="audio/countdown.mp3" type="audio/mpeg">
    <source src="https://cdn.pixabay.com/download/audio/2025/07/18/audio_ad9c94dad3.mp3?filename=circus-tent-376513.mp3" type="audio/mpeg">
  </audio>
  <audio id="hornSound" preload="auto">
    <source src="audio/horn.mp3" type="audio/mpeg">
    <source src="https://cdn.pixabay.com/download/audio/2024/12/08/audio_b69d9ac3e1.mp3?filename=air-horn-273892.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
