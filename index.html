<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teamspiel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🍻 Teamspiel</h1>

  <div id="setup">
    <h2>Spiel-Einstellungen</h2>
    <label>Team 1 Name: <input type="text" id="team1Name" value="Team 1"></label><br>
    <label>Team 2 Name: <input type="text" id="team2Name" value="Team 2"></label><br>
    <label>Anzahl Spieler: <input type="number" id="playerCount" min="2" max="12" value="4"></label><br>
    <label>Fortgeschrittener Modus (Strafbier): <input type="checkbox" id="advanced"></label><br><br>
    <button onclick="showSettings()">⚙️ Einstellungen</button>
    <button onclick="setupPlayers()">Weiter</button>
  </div>

  <div id="settings" class="hidden">
    <h2>Einstellungen</h2>
    <p>Countdown Länge (3–25 Sekunden):</p>
    <input type="range" id="countMin" min="3" max="25" value="5">
    Min: <span id="countMinVal">5</span>s<br>
    <input type="range" id="countMax" min="3" max="25" value="13">
    Max: <span id="countMaxVal">13</span>s

    <p>Trefferwahrscheinlichkeit (%):</p>
    <input type="range" id="hitChance" min="0" max="100" step="5" value="25">
    <span id="hitChanceVal">25</span>%

    <p>Wahrscheinlichkeit Flaschenereignis (%):</p>
    <input type="range" id="bottleChance" min="0" max="100" step="5" value="10">
    <span id="bottleChanceVal">10</span>%

    <p>Wahrscheinlichkeit Strafbier (%):</p>
    <input type="range" id="beerChance" min="0" max="100" step="5" value="5">
    <span id="beerChanceVal">5</span>%

    <br><br>
    <button onclick="backToSetup()">⬅️ Zurück</button>
  </div>

  <div id="players" class="hidden">
    <h2>Spielernamen eingeben</h2>
    <div id="playerInputs"></div>
    <button onclick="startGame()">Spiel starten</button>
  </div>

  <div id="game" class="hidden">
    <h2 id="teamTurn"></h2>
    <div id="team1" class="team"></div>
    <div id="team2" class="team"></div>
    <p id="actionText"></p>
    <p id="countdown"></p>
    <button id="throwBtn" onclick="doThrow()">Wurf</button>
  </div>

  <div id="visual" class="hidden"></div>

  <audio id="countdownMusic" src="https://cdn.pixabay.com/download/audio/2025/07/18/audio_ad9c94dad3.mp3?filename=circus-tent-376513.mp3" preload="auto"></audio>
  <audio id="hornSound" src="https://cdn.pixabay.com/download/audio/2024/12/08/audio_b69d9ac3e1.mp3?filename=air-horn-273892.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
